  <!-- Dollar sign: vertical line -->
  <line x1="16" y1="9.5" x2="16" y2="22.5" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Dollar sign: S curve -->
  <path d="M19 12.8c0-1.5-1.3-2.4-3-2.4s-3 .9-3 2.4 1.3 2 3 2.4 3 1.1 3 2.4-1.3 2.4-3 2.4-3-.9-3-2.4" stroke="#1e1b4b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
